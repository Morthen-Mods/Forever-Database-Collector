name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  ADDON_NAME: Forever-Database-Collector

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        run: |
          TOC_VERSION=$(sed -n 's/^## Version:[[:space:]]*\([0-9.]*\).*/\1/p' "${ADDON_NAME}.toc")
          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          LAST_VERSION="${LAST_TAG#v}"

          if [ -z "$LAST_VERSION" ]; then
            # No release yet: bump the version from the TOC
            BASE="$TOC_VERSION"
          else
            BASE="$LAST_VERSION"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"

          # If the TOC was raised manually (e.g. 0.2.0), use it as-is
          if [ -n "$LAST_VERSION" ] && [ "$(printf '%s\n%s\n' "$TOC_VERSION" "$LAST_VERSION" | sort -V | tail -n1)" = "$TOC_VERSION" ] && [ "$TOC_VERSION" != "$LAST_VERSION" ]; then
            NEXT="$TOC_VERSION"
          fi

          echo "Last release: ${LAST_VERSION:-none}, TOC: ${TOC_VERSION}, next: ${NEXT}"
          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"

      - name: Build addon package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD_DIR="build/${ADDON_NAME}"
          mkdir -p "$BUILD_DIR"

          # Copy addon files (everything except repo/CI metadata)
          rsync -a \
            --exclude '.git*' \
            --exclude '.github' \
            --exclude 'build' \
            ./ "$BUILD_DIR/"

          # Set version in the packaged TOC
          sed -i "s/^## Version:.*/## Version: ${VERSION}/" "$BUILD_DIR/${ADDON_NAME}.toc"

          cd build
          zip -r "${ADDON_NAME}-${VERSION}.zip" "${ADDON_NAME}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" \
            "build/${ADDON_NAME}-${VERSION}.zip" \
            --target "$GITHUB_SHA" \
            --title "${ADDON_NAME} ${VERSION}" \
            --generate-notes
