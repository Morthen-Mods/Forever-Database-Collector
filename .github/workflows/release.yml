name: Release

on:
  push:
    branches:
      - main
    paths:
      - "Forever-Database-Collector.toc"
  workflow_dispatch:

permissions:
  contents: write # push the version tag

concurrency:
  group: release
  cancel-in-progress: false

env:
  ADDON_NAME: Forever-Database-Collector
  # BigWigsMods/packager v2
  PACKAGER_SHA: e50a250f8705041e40f2fa1ddcb280a686d65aa0

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Read version from TOC
        id: version
        run: |
          VERSION=$(sed -n 's/^## Version:[[:space:]]*\([^[:space:]]*\).*/\1/p' "${ADDON_NAME}.toc")
          if [ -z "$VERSION" ]; then
            echo "::error::No '## Version:' found in ${ADDON_NAME}.toc"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "Version ${VERSION} is already released, skipping."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version ${VERSION}, releasing."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package and upload to CurseForge
        if: steps.version.outputs.release == 'true'
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
        run: |
          if [ -z "$CF_API_KEY" ] || [ -z "$CF_PROJECT_ID" ]; then
            echo "::error::Secret CF_API_KEY and variable CF_PROJECT_ID must be set"
            exit 1
          fi

          # The packager takes the version from the tag on HEAD
          git tag "v${{ steps.version.outputs.version }}"

          curl -sSfL -o "$RUNNER_TEMP/release.sh" \
            "https://raw.githubusercontent.com/BigWigsMods/packager/${PACKAGER_SHA}/release.sh"

          # On branch pushes the packager skips a HEAD that already has a tag
          # (it expects a separate tag-triggered run), so don't report a push.
          GITHUB_EVENT_NAME=workflow_dispatch bash "$RUNNER_TEMP/release.sh" -p "$CF_PROJECT_ID"

      - name: Push version tag
        if: steps.version.outputs.release == 'true'
        run: git push origin "v${{ steps.version.outputs.version }}"
